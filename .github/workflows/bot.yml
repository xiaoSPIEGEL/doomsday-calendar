name: Telegram Bot

on:
  schedule:
    # Turno da Manhã (13:15 UTC a 13:45 UTC)
    - cron: '15 13 * * *'
    # Turno da Noite (22:45 UTC a 23:15 UTC)
    - cron: '45 22 * * *'
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependências
        run: pip install requests
      - name: Rodar o script do Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REE_USERNAME: ${{ secrets.REE_USERNAME }}
          MAII_USERNAME: ${{ secrets.MAII_USERNAME }}
        run: python main.py
