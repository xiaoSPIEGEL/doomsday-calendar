name: Telegram Bot

on:
  schedule:
    # 13:15 UTC (Preparação) - O Bot vai rodar nesta janela e enviar o aviso
    - cron: '15 13 * * *'
    # 22:45 UTC (Véspera de eventos) - 1h15 antes do reset
    - cron: '45 22 * * *'
    # 23:15 UTC (Fechamento de eventos) - 45m antes do reset
    - cron: '15 23 * * *'
    # 23:30 UTC (Resumo Diário) - 30m antes do reset
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependências
        run: pip install requests
      - name: Rodar o script do Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REE_USERNAME: ${{ secrets.REE_USERNAME }}
          MAII_USERNAME: ${{ secrets.MAII_USERNAME }}
        run: python main.py
